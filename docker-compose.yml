services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_claims
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense -d expense_claims']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://expense:expense@db:5432/expense_claims?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN_SECONDS: 86400
      BCRYPT_SALT_ROUNDS: 10
      UPLOAD_DIR: /app/uploads
      MAX_RECEIPT_SIZE_BYTES: 5242880
      COOKIE_SECURE: 'false'
    ports:
      - '4000:4000'
    volumes:
      - backend_uploads:/app/uploads

  # Only started with `docker compose --profile test up -d db_test` — an isolated
  # Postgres for the integration test suite so `npm test` never touches dev
  # data (plan-backend.md §9). Matches TEST_DATABASE_URL in .env.example.
  db_test:
    image: postgres:16-alpine
    restart: 'no'
    profiles: ['test']
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_claims_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense -d expense_claims_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  backend_uploads:

# Render Blueprint (https://render.com/docs/blueprint-spec) — provisions
# the backend + a managed Postgres database together, wired to each other
# automatically. In the Render dashboard: New -> Blueprint -> select this repo.
#
# Because both services run inside Render's private network, the backend
# talks to the database over its *internal* hostname — the
# external-hostname/SSL/reachability issues you can hit connecting to a
# Render Postgres instance from your own machine don't apply here.
#
# No manual seeding step needed: backend/Dockerfile's CMD runs migrations
# then the seed script on every boot, and the seed script no-ops itself
# once the database already has any users — so it only actually seeds on
# the first boot. Also means the Shell tab (a paid-plan feature) is never
# required to get demo data in.

services:
  - type: web
    name: expense-claims-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-claims-db
          property: connectionString
      - key: PORT
        value: '4000'
      - key: NODE_ENV
        value: production
      # Update this once the frontend is deployed somewhere.
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: '86400'
      - key: BCRYPT_SALT_ROUNDS
        value: '10'
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_RECEIPT_SIZE_BYTES
        value: '5242880'
      # Render terminates TLS at the edge, so the auth cookie can (and
      # should) require HTTPS in this environment.
      - key: COOKIE_SECURE
        value: 'true'

databases:
  - name: expense-claims-db
    plan: free
    region: oregon
    postgresMajorVersion: '16'

# Free-plan caveats worth knowing:
# - The free Postgres database expires after 30 days unless upgraded.
# - The free web service plan has no persistent disk, so files under
#   UPLOAD_DIR (uploaded receipts) do NOT survive a redeploy. Add a `disk:`
#   block under the service (requires a paid plan) if that matters.
#
# Cross-site cookies (frontend and backend on different domains/subdomains,
# e.g. a local frontend calling this deployed backend, or the frontend
# deployed to its own onrender.com subdomain later) are handled:
# `COOKIE_SECURE=true` here makes `backend/src/lib/cookies.ts` issue the
# auth cookie with `SameSite=None; Secure`, which is what's required for
# the browser to actually send it back on a cross-site `fetch`/XHR — a
# same-site-only `SameSite=Lax` cookie (the local-dev default) gets stored
# fine but is silently withheld from those requests, which looks exactly
# like a broken/expired session (verified: reproduced and fixed).
